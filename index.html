<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Próximamente — Coro Saudade de Pamplona</title>
    <!-- Importación de las tipografías oficiales del proyecto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@0,300;0,400;0,600;1,300;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --black:       #192338;
            --white:       #f0ece3;   /* crema medio */
            --off-white:   #e6e0d4;   /* crema más oscuro */
            --gold:        #192338;   
            --gray-mid:    #5c5549;   /* gris cálido oscuro */
            --serif-title: 'Cormorant Infant', Georgia, serif;
            --serif-felt:  'IM Fell English', Georgia, serif;
        }

        *, *::before, *::after { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            font-family: var(--serif-title);
            background-color: var(--white);
            color: var(--black);
            font-size: 19px;
            line-height: 1.75;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 2rem;
        }

        .container {
            text-align: center;
            max-width: 650px;
            width: 100%;
            animation: fadeUp 1.2s cubic-bezier(0.4, 0, 0.2, 1) both;
        }

        /* Ornamento de líneas degradadas idéntico al estilo del sitio */
        .ornament-line {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            width: 100%;
        }

        .ornament-line::before,
        .ornament-line::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(184,148,31,0.4), transparent);
        }

        .ornament-line span {
            color: var(--gray-mid);
            font-size: 1.3rem;
            font-family: var(--serif-felt);
        }

        h1 {
            font-family: var(--serif-title);
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 400;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            letter-spacing: 0.02em;
        }

        h1 em {
            font-style: italic;
            font-weight: 300;
            color: var(--gray-mid);
            font-family: var(--serif-title);
        }

        p {
            font-family: var(--serif-title);
            font-size: 1.15rem;
            line-height: 1.8;
            color: var(--gray-mid);
            font-style: italic;
            max-width: 520px;
            margin: 0 auto 3rem auto;
        }

        /* Spinner elegante y pausado a juego con la estética del coro */
        .spinner {
            width: 28px;
            height: 28px;
            border: 1px solid rgba(25, 35, 56, 0.1);
            border-radius: 50%;
            border-top-color: var(--gray-mid);
            margin: 0 auto;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            body { padding: 1.5rem; }
            h1 { font-size: 2.5rem; }
            p { font-size: 1.05rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ornamento clásico adaptado -->
        <div class="ornament-line">
            <span>§</span>
        </div>
        
        <!-- Título principal con la palabra enfatizada en cursiva como tus secciones -->
        <h1>Sitio web <em>próximamente</em></h1>
        
        <!-- Mensaje secundario con tu tipografía e interlineado corporativo -->
        <p>Estamos preparando el nuevo espacio digital del Coro Saudade de Pamplona. Volveremos a estar disponibles muy pronto.</p>
        
        <!-- Indicador de carga sutil -->
        <div class="spinner"></div>
    </div>

</body>
</html>
