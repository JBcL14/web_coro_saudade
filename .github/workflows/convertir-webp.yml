# ═══════════════════════════════════════════════════════════════════════════
#  .github/workflows/convertir-webp.yml — Coro Saudade de Pamplona
#
#  Se activa cuando Apps Script sube:
#    · Fotos  → assets/images/staging/**   (se convierten a WebP)
#    · Vídeos → assets/videos/carrusel/**  (se indexan directamente)
#
#  En ambos casos reconstruye assets/carrusel.json completo
#  leyendo las dos carpetas del disco, no solo los archivos nuevos.
# ═══════════════════════════════════════════════════════════════════════════

name: Actualizar carrusel (WebP + JSON)

on:
  push:
    paths:
      - 'assets/images/staging/**'
      - 'assets/videos/carrusel/**'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar sharp
        run: npm install sharp

      # Escribimos el script en un .js separado para evitar problemas
      # de escaping de regex cuando bash procesa un heredoc.
      - name: Escribir script Node
        run: |
          cat > ./actualizar.js << 'JSEOF'
          const sharp = require('sharp');
          const fs    = require('fs');
          const path  = require('path');

          // ── Rutas (deben coincidir con CONFIG en CarruselSaudade.gs)
          const STAGING  = 'assets/images/staging';
          const CARRUSEL = 'assets/images/carrusel';
          const VIDEOS   = 'assets/videos/carrusel';
          const JSON_OUT = 'assets/carrusel.json';
          const QUALITY  = 82;

          const EXT_IMG = /\.(jpe?g|png|tiff?|bmp|gif|avif)$/i;
          const EXT_VID = /\.(mp4|mov|avi|webm|mkv|m4v)$/i;
          const SKIP    = /^\.gitkeep$/i;

          // Crear carpetas si no existen (primera ejecución)
          [STAGING, CARRUSEL, VIDEOS].forEach(d => fs.mkdirSync(d, { recursive: true }));

          async function main() {

            // ── 1. Convertir imágenes del staging a WebP ─────────────────
            const enStaging = fs.existsSync(STAGING)
              ? fs.readdirSync(STAGING).filter(f => EXT_IMG.test(f) && !SKIP.test(f))
              : [];

            console.log('=== FOTOS en staging: ' + enStaging.length);

            for (const archivo of enStaging) {
              const entrada = path.join(STAGING, archivo);
              const nombre  = path.basename(archivo, path.extname(archivo));
              const salida  = path.join(CARRUSEL, nombre + '.webp');

              try {
                await sharp(entrada).webp({ quality: QUALITY }).toFile(salida);
                const pct = Math.round(
                  (1 - fs.statSync(salida).size / fs.statSync(entrada).size) * 100
                );
                console.log('  OK  ' + archivo + '  ->  ' + nombre + '.webp  (' + pct + '% mas ligero)');
                fs.unlinkSync(entrada); // borrar original del staging
              } catch (err) {
                console.error('  ERR ' + archivo + ': ' + err.message);
              }
            }

            // ── 2. Leer estado actual de disco (fuente de verdad) ─────────
            const fotos = fs.existsSync(CARRUSEL)
              ? fs.readdirSync(CARRUSEL)
                  .filter(f => /\.webp$/i.test(f) && !SKIP.test(f))
                  .sort()
              : [];

            const videos = fs.existsSync(VIDEOS)
              ? fs.readdirSync(VIDEOS)
                  .filter(f => EXT_VID.test(f) && !SKIP.test(f))
                  .sort()
              : [];

            console.log('=== ESTADO DISCO: ' + fotos.length + ' fotos WebP, ' + videos.length + ' videos');

            // ── 3. Reconstruir carrusel.json preservando el orden existente
            //       pero añadiendo los nuevos y eliminando los borrados.
            let json = { images: [], videos: [] };
            if (fs.existsSync(JSON_OUT)) {
              try {
                const raw = fs.readFileSync(JSON_OUT, 'utf8');
                json = JSON.parse(raw);
              } catch (_) {
                console.warn('  AVISO: carrusel.json existente no era JSON valido. Se recrea.');
              }
            }
            if (!Array.isArray(json.images)) json.images = [];
            if (!Array.isArray(json.videos)) json.videos = [];

            // Añadir los que estén en disco pero no en el JSON (sin duplicar)
            fotos.forEach(f  => { if (!json.images.includes(f)) json.images.push(f); });
            videos.forEach(v => { if (!json.videos.includes(v)) json.videos.push(v); });

            // Eliminar los que ya no estén en disco
            json.images = json.images.filter(f => fotos.includes(f));
            json.videos = json.videos.filter(v => videos.includes(v));

            const jsonStr = JSON.stringify(json, null, 2);
            fs.writeFileSync(JSON_OUT, jsonStr);

            console.log('=== carrusel.json actualizado:');
            console.log('    images: [' + json.images.join(', ') + ']');
            console.log('    videos: [' + json.videos.join(', ') + ']');
          }

          main().catch(err => { console.error(err); process.exit(1); });
          JSEOF

      - name: Ejecutar script
        run: |
          node ./actualizar.js
          rm ./actualizar.js

      - name: Commit y push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Añadir todo lo que puede haber cambiado
          git add assets/images/carrusel/ \
                  assets/images/staging/ \
                  assets/videos/carrusel/ \
                  assets/carrusel.json

          if git diff --cached --quiet; then
            echo "Sin cambios que commitear."
          else
            # Contar fotos y vídeos nuevos para el mensaje del commit
            NFOTOS=$(git diff --cached --name-only | grep -c "images/carrusel/.*\.webp" || true)
            NVIDS=$(git diff --cached --name-only  | grep -c "videos/carrusel/"         || true)
            git commit -m "[auto] +${NFOTOS} foto(s) WebP, +${NVIDS} video(s) — carrusel.json ok"
            git push
            echo "Push completado."
          fi
